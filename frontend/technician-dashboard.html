
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixTrack | Technician Workspace</title>
    <link rel="stylesheet" href="style.css?v=10">

    <style>
        .tw-page {
            max-width: 1160px;
            margin: 0 auto;
        }

        .tw-heading {
            margin-bottom: 26px;
        }

        .tw-heading h2 {
            margin-bottom: 7px;
        }

        .tw-heading p {
            color: #64748b;
        }

        .tw-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 26px;
        }

        .tw-stat {
            background: #fff;
            padding: 22px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 12px rgba(0,0,0,.03);
        }

        .tw-stat span {
            display: block;
            font-size: 13px;
            color: #64748b;
            margin-bottom: 10px;
        }

        .tw-stat strong {
            font-size: 32px;
            color: #0f172a;
        }

        .tw-panel {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 24px;
        }

        .tw-panel-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .tw-panel-top h3 {
            margin: 0;
        }

        .tw-tabs {
            display: flex;
            gap: 8px;
        }

        .tw-tab {
            padding: 10px 17px;
            border: 0;
            border-radius: 9px;
            background: #f1f5f9;
            color: #334155;
            font-weight: 600;
            cursor: pointer;
        }

        .tw-tab.active {
            background: #2563eb;
            color: #fff;
        }

        .tw-card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 19px;
            margin-bottom: 14px;
        }

        .tw-card-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .tw-card h4 {
            margin: 0 0 8px;
            font-size: 17px;
            color: #0f172a;
        }

        .tw-card p {
            margin: 6px 0;
            font-size: 14px;
            color: #475569;
            overflow-wrap: anywhere;
        }

        .tw-badge {
            padding: 6px 11px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            background: #dbeafe;
            color: #1d4ed8;
        }

        .tw-badge.pending {
            background: #fef3c7;
            color: #92400e;
        }

        .tw-badge.completed,
        .tw-badge.released {
            background: #dcfce7;
            color: #166534;
        }

        .tw-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin-top: 17px;
        }

        .tw-btn {
            border: 0;
            padding: 10px 15px;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .tw-btn.light {
            background: #eff6ff;
            color: #1d4ed8;
        }

        .tw-btn:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        .tw-expand {
            margin-top: 17px;
            border-top: 1px solid #e2e8f0;
            padding-top: 15px;
        }

        .tw-expand[hidden] {
            display: none;
        }

        .tw-expand label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .tw-expand select {
            display: block;
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .tw-form label {
            display: block;
            margin: 16px 0 8px;
            font-weight: 600;
        }

        .tw-form select,
        .tw-form textarea {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            font: inherit;
        }

        .tw-form button {
            margin-top: 17px;
        }

        .tw-message {
            margin: 12px 0;
            font-size: 14px;
        }

        @media(max-width: 700px) {
            .tw-stats {
                grid-template-columns: 1fr;
            }

            .tw-panel {
                padding: 16px;
            }

            .tw-tabs {
                width: 100%;
            }

            .tw-tab {
                flex: 1;
            }
        }
    </style>
    <link rel="stylesheet" href="fixtrack-modern.css?v=1">
</head>

<body>

    <header class="dashboard-header">
        <div>
            <h1>FixTrack</h1>
            <p>Technician Workspace</p>
        </div>

        <button type="button" id="logoutBtn">
            Logout
        </button>
    </header>

    <main class="dashboard-container tw-page">

        <section class="dashboard-welcome tw-heading">
            <h2 id="welcomeUser">Welcome, Technician!</h2>
            <p>Manage repairs, update progress, and record diagnoses.</p>
        </section>

        <section class="tw-stats">
            <div class="tw-stat">
                <span>Total Assigned</span>
                <strong id="totalAssigned">—</strong>
            </div>

            <div class="tw-stat">
                <span>In Progress</span>
                <strong id="totalInProgress">—</strong>
            </div>

            <div class="tw-stat">
                <span>Completed</span>
                <strong id="totalCompleted">—</strong>
            </div>
        </section>

        <section class="tw-panel" id="assignedRepairsSection">

            <div class="tw-panel-top">
                <h3 id="repairSectionTitle">My Repairs</h3>

                <div class="tw-tabs">
                    <button
                        type="button"
                        id="viewRepairsBtn"
                        class="tw-tab active"
                    >
                        Active Repairs
                    </button>

                    <button
                        type="button"
                        id="viewHistoryBtn"
                        class="tw-tab"
                    >
                        History
                    </button>
                </div>
            </div>

            <p id="repairMessage" class="tw-message" role="status"></p>

            <div id="assignedRepairsList">
                Loading repairs...
            </div>

        </section>

        <section
            class="tw-panel"
            id="diagnosisSection"
            style="display:none;"
        >

            <div class="tw-panel-top">
                <h3>Record Diagnosis</h3>

                <button
                    type="button"
                    id="backToRepairsBtn"
                    class="tw-btn light"
                >
                    Back to Repairs
                </button>
            </div>

            <form id="diagnosisForm" class="tw-form">

                <label for="diagnosisRepair">Assigned Repair</label>
                <select id="diagnosisRepair" required>
                    <option value="">Select a repair</option>
                </select>

                <label for="diagnosisDetails">Diagnosis Details</label>
                <textarea
                    id="diagnosisDetails"
                    rows="4"
                    placeholder="Describe the problem found..."
                    required
                ></textarea>

                <label for="recommendedAction">Recommended Action</label>
                <textarea
                    id="recommendedAction"
                    rows="3"
                    placeholder="Describe the recommended repair..."
                ></textarea>

                <button
                    type="submit"
                    id="saveDiagnosisBtn"
                    class="tw-btn"
                >
                    Save Diagnosis
                </button>

                <p
                    id="diagnosisMessage"
                    class="tw-message"
                    role="status"
                ></p>

            </form>

            <h3 style="margin-top:30px;">Saved Diagnoses</h3>

            <div id="diagnosisList">
                Loading diagnoses...
            </div>

        </section>

    </main>

    <script src="technician-dashboard.js?v=10"></script>

</body>
</html>

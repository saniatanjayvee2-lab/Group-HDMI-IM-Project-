
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixTrack | Technician Dashboard</title>
    <link rel="stylesheet" href="style.css?v=7">

    <style>
        .tech-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .tech-summary {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            margin: 24px 0;
        }

        .tech-stat {
            background: white;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 4px 16px rgba(15, 23, 42, .05);
        }

        .tech-stat span {
            display: block;
            color: #64748b;
            font-size: 14px;
        }

        .tech-stat strong {
            display: block;
            font-size: 30px;
            margin-top: 8px;
            color: #0f172a;
        }

        .tech-panel {
            background: white;
            border-radius: 14px;
            padding: 24px;
            margin-top: 20px;
            box-shadow: 0 4px 16px rgba(15, 23, 42, .05);
        }

        .tech-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .tech-panel-header h3 {
            margin: 0;
        }

        .tech-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tech-tab {
            background: #f1f5f9;
            color: #334155;
            border: 0;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: 600;
        }

        .tech-tab.active {
            background: #2563eb;
            color: white;
        }

        .tech-repair-card {
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 14px;
        }

        .tech-repair-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }

        .tech-repair-top h4 {
            margin: 0 0 8px;
            font-size: 17px;
        }

        .tech-repair-card p {
            margin: 6px 0;
            color: #475569;
            font-size: 14px;
        }

        .tech-status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            background: #dbeafe;
            color: #1d4ed8;
        }

        .tech-status.completed,
        .tech-status.released {
            background: #dcfce7;
            color: #166534;
        }

        .tech-status.pending {
            background: #fef3c7;
            color: #92400e;
        }

        .tech-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .tech-btn {
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            background: #2563eb;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .tech-btn.secondary {
            background: #eff6ff;
            color: #1d4ed8;
        }

        .tech-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .tech-details {
            display: none;
            border-top: 1px solid #e2e8f0;
            margin-top: 16px;
            padding-top: 16px;
        }

        .tech-details.open {
            display: block;
        }

        .tech-status-editor {
            margin-top: 14px;
            padding: 14px;
            border-radius: 10px;
            background: #f8fafc;
        }

        .tech-status-editor select {
            width: 100%;
            padding: 11px;
            margin: 10px 0;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
        }

        .tech-form label {
            display: block;
            margin: 16px 0 7px;
            font-weight: 600;
        }

        .tech-form select,
        .tech-form textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font: inherit;
        }

        .tech-form textarea {
            resize: vertical;
        }

        .tech-form button {
            margin-top: 18px;
        }

        .tech-message {
            margin: 12px 0;
            font-size: 14px;
        }

        @media (max-width: 650px) {
            .tech-summary {
                grid-template-columns: 1fr;
            }

            .tech-panel {
                padding: 16px;
            }
        }
    </style>
</head>

<body>

    <header class="dashboard-header">
        <div>
            <h1>FixTrack</h1>
            <p>Technician Dashboard</p>
        </div>

        <button type="button" id="logoutBtn">
            Logout
        </button>
    </header>

    <main class="dashboard-container tech-container">

        <section class="dashboard-welcome">
            <h2 id="welcomeUser">Welcome, Technician!</h2>
            <p>Manage your assigned repairs and track progress.</p>
        </section>

        <!-- SUMMARY -->
        <section class="tech-summary">
            <div class="tech-stat">
                <span>Total Assigned</span>
                <strong id="totalAssigned">—</strong>
            </div>

            <div class="tech-stat">
                <span>In Progress</span>
                <strong id="totalInProgress">—</strong>
            </div>

            <div class="tech-stat">
                <span>Completed</span>
                <strong id="totalCompleted">—</strong>
            </div>
        </section>

        <!-- REPAIR MANAGEMENT -->
        <section class="tech-panel" id="assignedRepairsSection">

            <div class="tech-panel-header">
                <h3 id="repairSectionTitle">My Repairs</h3>

                <div class="tech-tabs">
                    <button
                        type="button"
                        class="tech-tab active"
                        id="viewRepairsBtn"
                    >
                        My Repairs
                    </button>

                    <button
                        type="button"
                        class="tech-tab"
                        id="viewHistoryBtn"
                    >
                        Repair History
                    </button>
                </div>
            </div>

            <p id="repairMessage" class="tech-message" role="status"></p>

            <div id="assignedRepairsList">
                Loading repairs...
            </div>

        </section>

        <!-- DIAGNOSIS -->
        <section
            class="tech-panel"
            id="diagnosisSection"
            style="display:none;"
        >

            <div class="tech-panel-header">
                <h3>Manage Diagnosis</h3>

                <button
                    type="button"
                    class="tech-btn secondary"
                    id="backToRepairsBtn"
                >
                    Back to Repairs
                </button>
            </div>

            <p>Record your findings for an assigned repair.</p>

            <form id="diagnosisForm" class="tech-form">

                <label for="diagnosisRepair">
                    Select Assigned Repair
                </label>

                <select id="diagnosisRepair" required>
                    <option value="">Select a repair</option>
                </select>

                <label for="diagnosisDetails">
                    Diagnosis Details
                </label>

                <textarea
                    id="diagnosisDetails"
                    rows="4"
                    placeholder="Describe the device problem..."
                    required
                ></textarea>

                <label for="recommendedAction">
                    Recommended Action
                </label>

                <textarea
                    id="recommendedAction"
                    rows="3"
                    placeholder="Describe the recommended repair..."
                ></textarea>

                <button
                    type="submit"
                    id="saveDiagnosisBtn"
                    class="tech-btn"
                >
                    Save Diagnosis
                </button>

                <p
                    id="diagnosisMessage"
                    class="tech-message"
                    role="status"
                    aria-live="polite"
                ></p>

            </form>

            <h3 style="margin-top:30px;">My Saved Diagnoses</h3>

            <div id="diagnosisList">
                Loading diagnoses...
            </div>

        </section>

    </main>

    <script src="technician-dashboard.js?v=7"></script>

</body>
</html>

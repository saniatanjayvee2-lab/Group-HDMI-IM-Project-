
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FixTrack | Manage Repairs</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="admin-repairs-page">

    <!-- HEADER -->
    <header class="dashboard-header">
        <div>
            <h1>FixTrack</h1>
            <p>Admin / Repair Management</p>
        </div>

        <button
            type="button"
            onclick="window.location.href='admin-dashboard.html'"
        >
            Back to Dashboard
        </button>
    </header>

    <!-- MAIN DASHBOARD -->
    <main class="repairs-dashboard">

        <!-- PAGE INTRO -->
        <section class="repairs-page-heading">
            <div>
                <h2>Repair Management</h2>
                <p>
                    Manage customer repair requests,
                    technician assignments, billing,
                    and payment tracking.
                </p>
            </div>
        </section>

        <!-- REPAIR REQUESTS -->
        <section class="repairs-workspace">

            <div class="repairs-section-header">
                <div>
                    <h3>All Repair Requests</h3>
                    <p>
                        View and manage registered
                        customer repairs.
                    </p>
                </div>
            </div>

            <div id="admin-repair-list">
                <p>Loading repair requests...</p>
            </div>

        </section>

    </main>

    <script src="admin-repairs.js"></script>

</body>
</html>

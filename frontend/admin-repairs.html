
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixTrack | Manage Repairs</title>
    <link rel="stylesheet" href="style.css?v=6">
    <link rel="stylesheet" href="fixtrack-modern.css?v=1">
<link rel="stylesheet" href="fixtrack-admin-modules.css?v=2">
</head>

<body class="admin-repairs-page">

    <header class="dashboard-header">
        <div>
            <h1>FixTrack</h1>
            <p>Admin / Repair Management</p>
        </div>
        <button type="button" onclick="window.location.href='admin-dashboard.html'">
            Back to Dashboard
        </button>
    </header>

    <main class="repairs-dashboard">
        <section class="repairs-page-heading">
            <h2>Repair Management</h2>
            <p>View and manage customer repairs in one organized place.</p>
        </section>

        <section class="repairs-workspace">
            <div class="repairs-section-header">
                <h3>All Repair Requests</h3>
                <p>Select Manage Repair to open the repair management window.</p>
            </div>
            <div id="admin-repair-list">
                <p>Loading repair requests...</p>
            </div>
        </section>
    </main>

    <!-- REPAIR MANAGEMENT MODAL -->
    <div id="repair-modal" class="repair-modal" hidden>
        <div class="repair-modal-dialog"
             role="dialog"
             aria-modal="true"
             aria-labelledby="repair-modal-title"
             tabindex="-1">

            <div class="repair-modal-header">
                <div>
                    <h2 id="repair-modal-title">Manage Repair</h2>
                    <p id="repair-modal-subtitle">Repair information</p>
                </div>
                <button id="repair-modal-x"
                        class="repair-modal-close"
                        type="button"
                        aria-label="Close">×</button>
            </div>

            <div class="repair-modal-tabs" role="tablist">
                <button type="button" class="repair-tab active" data-tab="repair">
                    Repair
                </button>
                <button type="button" class="repair-tab" data-tab="billing">
                    Billing
                </button>
                <button type="button" class="repair-tab" data-tab="payments">
                    Payments
                </button>
            </div>

            <div class="repair-modal-body">
                <section id="repair-panel-repair" class="repair-tab-panel"></section>
                <section id="repair-panel-billing" class="repair-tab-panel" hidden></section>
                <section id="repair-panel-payments" class="repair-tab-panel" hidden></section>
            </div>

            <div class="repair-modal-footer">
                <button id="repair-modal-close" type="button">Close</button>
            </div>
        </div>
    </div>

    <!-- EXISTING REPAIR, BILLING AND PAYMENT FUNCTIONS -->
    <script src="admin-repairs.js"></script>

    <script>
    (() => {
        const list = document.getElementById("admin-repair-list");
        const modal = document.getElementById("repair-modal");
        const dialog = modal.querySelector(".repair-modal-dialog");
        const title = document.getElementById("repair-modal-title");
        const subtitle = document.getElementById("repair-modal-subtitle");

        const panels = {
            repair: document.getElementById("repair-panel-repair"),
            billing: document.getElementById("repair-panel-billing"),
            payments: document.getElementById("repair-panel-payments")
        };

        const prepared = new WeakSet();
        let activeCard = null;
        let previousFocus = null;
        let billingLoadedFor = null;
        let billingLoading = null;

        function text(tag, value, className = "") {
            const element = document.createElement(tag);
            element.textContent = value;
            if (className) element.className = className;
            return element;
        }

        function readField(elements, prefix) {
            const found = elements.find(element =>
                element.tagName === "P" &&
                element.textContent.startsWith(prefix)
            );
            return found
                ? found.textContent.slice(prefix.length).trim()
                : "—";
        }

        function showTab(name) {
            Object.entries(panels).forEach(([key, panel]) => {
                panel.hidden = key !== name;
            });

            modal.querySelectorAll(".repair-tab").forEach(button => {
                const selected = button.dataset.tab === name;
                button.classList.toggle("active", selected);
                button.setAttribute("aria-selected", String(selected));
            });
        }

        function movePaymentSection() {
            const payment = panels.billing.querySelector(".payment-section");
            if (payment) panels.payments.append(payment);
        }

        async function loadBillingIfNeeded(card) {
            if (!card || billingLoadedFor === card) return;
            if (billingLoading) return billingLoading;

            const section = panels.billing.querySelector(".repair-billing-section");
            if (!section) return;

            const button = section.querySelector(":scope > button");
            const content = section.querySelector(".repair-billing-content");

            if (!button || !content) return;

            billingLoading = (async () => {
                if (content.hidden) {
                    button.click();
                }

                // Wait for the original billing renderer to finish.
                for (let attempt = 0; attempt < 100; attempt++) {
                    if (!activeCard || activeCard !== card) return;

                    if (
                        content.querySelector(".billing-totals") ||
                        content.querySelector(".payment-section") ||
                        content.querySelector(".billing-entry-form")
                    ) {
                        billingLoadedFor = card;
                        organizeBillingForms();
                        movePaymentSection();
                        return;
                    }

                    await new Promise(resolve => setTimeout(resolve, 100));
                }
            })();

            try {
                await billingLoading;
            } finally {
                billingLoading = null;
            }
        }

        function openModal(card) {
            if (activeCard) closeModal();

            previousFocus = document.activeElement;
            activeCard = card;
            billingLoadedFor = null;

            const overview = card.querySelector(".repair-card-overview");
            const cardTitle = overview.querySelector("h4");
            const cardId = overview.querySelector(".repair-card-id");

            title.textContent = cardTitle
                ? cardTitle.textContent
                : "Manage Repair";

            subtitle.textContent = cardId
                ? cardId.textContent
                : "Repair details";

            const controls = card.querySelector(".repair-card-controls");
            const billing = card.querySelector(".repair-billing-section");

            if (controls) {
                panels.repair.append(controls);
                controls.hidden = false;
            }

            if (billing) {
                panels.billing.append(billing);
                billing.hidden = false;
            }

            modal.hidden = false;
            document.body.classList.add("repair-modal-open");
            showTab("repair");
            dialog.focus();
        }

        function closeModal() {
            if (!activeCard) return;

            const card = activeCard;
            const controls = panels.repair.querySelector(".repair-card-controls");
            const billing = panels.billing.querySelector(".repair-billing-section");
            const payment = panels.payments.querySelector(".payment-section");
            const billingContent = billing?.querySelector(".repair-billing-content");

            if (payment && billingContent) billingContent.append(payment);

            if (controls) {
                controls.hidden = true;
                card.append(controls);
            }

            if (billing) {
                billing.hidden = true;
                card.append(billing);
            }

            activeCard = null;
            billingLoadedFor = null;
            billingLoading = null;

            modal.hidden = true;
            document.body.classList.remove("repair-modal-open");

            if (previousFocus && previousFocus.isConnected) {
                previousFocus.focus();
            }
        }

        function organizeCard(card) {
            if (prepared.has(card)) return;
            prepared.add(card);

            const original = Array.from(card.children);
            const heading = original.find(item => item.tagName === "H4");
            const paragraphs = original.filter(item => item.tagName === "P");

            const name = heading ? heading.textContent : "Unknown Device";
            const repairId = readField(paragraphs, "Repair ID:");
            const customer = readField(paragraphs, "Customer:");
            const technician = readField(paragraphs, "Assigned Technician:");
            const problem = readField(paragraphs, "Problem:");
            const submitted = readField(paragraphs, "Submitted:");
            const status = readField(paragraphs, "Current Status:");

            const overview = document.createElement("div");
            overview.className = "repair-card-overview";

            const top = document.createElement("div");
            top.className = "repair-card-top";

            const titleBox = document.createElement("div");
            titleBox.className = "repair-card-title";
            titleBox.append(
                text("h4", name),
                text("span", repairId, "repair-card-id")
            );

            const badge = text("span", status, "repair-status-pill");
            const statusClass = status.toLowerCase().replace(/\s+/g, "-");

            if (["pending", "in-progress", "completed", "released"].includes(statusClass)) {
                badge.classList.add(statusClass);
            }

            top.append(titleBox, badge);

            const meta = document.createElement("div");
            meta.className = "repair-card-meta";

            [
                ["Customer", customer],
                ["Technician", technician],
                ["Problem", problem],
                ["Submitted", submitted]
            ].forEach(([label, value]) => {
                const row = document.createElement("p");
                const strong = document.createElement("strong");
                strong.textContent = label + ": ";
                row.append(strong, document.createTextNode(value));
                meta.append(row);
            });

            const manageButton = text(
                "button",
                "Manage Repair",
                "repair-manage-btn"
            );
            manageButton.type = "button";

            const controls = document.createElement("div");
            controls.className = "repair-card-controls";

            const billing = original.find(item =>
                item.classList.contains("repair-billing-section")
            );

            const infoPrefixes = [
                "Repair ID:",
                "Customer:",
                "Problem:",
                "Submitted:",
                "Current Status:",
                "Assigned Technician:"
            ];

            original.forEach(item => {
                if (
                    item === heading ||
                    item === billing ||
                    (
                        item.tagName === "P" &&
                        infoPrefixes.some(prefix =>
                            item.textContent.startsWith(prefix)
                        )
                    )
                ) return;

                controls.append(item);
            });

            controls.hidden = true;
            card.replaceChildren(overview, controls);

            if (billing) {
                billing.hidden = true;
                card.append(billing);
            }

            overview.append(top, meta, manageButton);
            manageButton.addEventListener("click", () => openModal(card));
        }

        function organizeCards() {
            list.querySelectorAll(":scope > .admin-repair-card")
                .forEach(organizeCard);

            if (activeCard && !activeCard.isConnected) {
                closeModal();
            }
        }

        // =====================================
        // COLLAPSIBLE BILLING FORMS
        // =====================================

        function organizeBillingForms() {
            const billingContent = panels.billing.querySelector(
                ".repair-billing-content"
            );

            if (!billingContent) return;

            const forms = Array.from(
                billingContent.querySelectorAll(
                    ".billing-entry-form:not([data-billing-organized])"
                )
            );

            forms.forEach((form, index) => {
                form.dataset.billingOrganized = "true";

                const labels = Array.from(form.querySelectorAll("label"))
                    .map(label => label.textContent.toLowerCase())
                    .join(" ");

                const fields = Array.from(
                    form.querySelectorAll("input, select")
                );

                const isLabor =
                    labels.includes("labor") ||
                    fields.some(field =>
                        field.name?.toLowerCase().includes("labor") ||
                        field.name?.toLowerCase().includes("description") ||
                        field.placeholder?.toLowerCase().includes("labor")
                    ) ||
                    (!labels.includes("part") && index > 0);

                const label = isLabor ? "Add Labor" : "Add Part";

                const wrapper = document.createElement("div");
                wrapper.className = "billing-form-wrapper";

                const toggle = document.createElement("button");
                toggle.type = "button";
                toggle.className = "billing-form-toggle";
                toggle.textContent = "+ " + label;
                toggle.setAttribute("aria-expanded", "false");

                const cancel = document.createElement("button");
                cancel.type = "button";
                cancel.className = "billing-form-cancel";
                cancel.textContent = "Cancel";

                form.before(wrapper);
                wrapper.append(toggle, form);
                form.append(cancel);
                form.hidden = true;

                function closeForm() {
                    form.hidden = true;
                    toggle.setAttribute("aria-expanded", "false");
                }

                toggle.addEventListener("click", () => {
                    const shouldOpen = form.hidden;

                    billingContent.querySelectorAll(
                        ".billing-form-wrapper"
                    ).forEach(other => {
                        const otherForm = other.querySelector(".billing-entry-form");
                        const otherToggle = other.querySelector(".billing-form-toggle");

                        if (otherForm) otherForm.hidden = true;
                        if (otherToggle) {
                            otherToggle.setAttribute("aria-expanded", "false");
                        }
                    });

                    form.hidden = !shouldOpen;
                    toggle.setAttribute(
                        "aria-expanded",
                        String(shouldOpen)
                    );
                });

                cancel.addEventListener("click", closeForm);
            });
        }

        const billingFormsObserver = new MutationObserver(() => {
            organizeBillingForms();
            movePaymentSection();
        });

        billingFormsObserver.observe(panels.billing, {
            childList: true,
            subtree: true
        });

        const observer = new MutationObserver(organizeCards);
        observer.observe(list, { childList: true });
        organizeCards();

        modal.querySelectorAll(".repair-tab").forEach(button => {
            button.addEventListener("click", async () => {
                if (!activeCard) return;

                const card = activeCard;
                const tab = button.dataset.tab;

                if (tab === "billing" || tab === "payments") {
                    await loadBillingIfNeeded(card);
                    if (activeCard !== card) return;
                    organizeBillingForms();
                    movePaymentSection();
                }

                showTab(tab);
            });
        });

        document.getElementById("repair-modal-x")
            .addEventListener("click", closeModal);

        document.getElementById("repair-modal-close")
            .addEventListener("click", closeModal);

        modal.addEventListener("click", event => {
            if (event.target === modal) closeModal();
        });

        document.addEventListener("keydown", event => {
            if (event.key === "Escape" && !modal.hidden) {
                closeModal();
            }

            if (event.key !== "Tab" || modal.hidden) return;

            const focusable = Array.from(
                modal.querySelectorAll(
                    "button:not([disabled]), input:not([disabled]), " +
                    "select:not([disabled]), a[href]"
                )
            ).filter(element => element.getClientRects().length > 0);

            if (!focusable.length) return;

            const first = focusable[0];
            const last = focusable[focusable.length - 1];

            if (event.shiftKey && document.activeElement === first) {
                event.preventDefault();
                last.focus();
            } else if (!event.shiftKey && document.activeElement === last) {
                event.preventDefault();
                first.focus();
            }
        });
    })();
    </script>

<script src="fixtrack-admin-nav.js?v=2"></script>
</body>
</html>

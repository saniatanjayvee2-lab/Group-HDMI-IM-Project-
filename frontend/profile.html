
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Profile | FixTrack</title>

  <link rel="stylesheet" href="style.css?v=5">
  <script src="profile.js?v=5" defer></script>
</head>

<body>

  <header class="site-header">
    <div>
      <div class="brand">FixTrack</div>
      <div class="subtitle">
        Computer Repair Management System
      </div>
    </div>

    <a href="dashboard.html" class="back-button">
      Back to Dashboard
    </a>
  </header>

  <main class="container">

    <h1>My Profile</h1>

    <p class="intro">
      View and manage your personal information.
    </p>

    <div
      id="message"
      role="status"
      aria-live="polite"
    ></div>

    <div class="profile-edit-toolbar">
      <button type="button" id="edit-profile-btn">
        Edit Profile
      </button>
    </div>

    <form id="profile-form">

      <!-- PERSONAL INFORMATION -->
      <section class="panel">

        <h2>Personal Information</h2>

        <div class="grid three">

          <label>
            First Name
            <input
              id="first_name"
              maxlength="100"
              autocomplete="given-name"
              required
              readonly
            >
          </label>

          <label>
            Middle Name
            <input
              id="middle_name"
              maxlength="100"
              readonly
            >
          </label>

          <label>
            Last Name
            <input
              id="last_name"
              maxlength="100"
              autocomplete="family-name"
              required
              readonly
            >
          </label>

        </div>

        <div class="grid two">

          <label>
            Email Address
            <input
              id="email"
              type="email"
              maxlength="255"
              autocomplete="email"
              required
              readonly
            >
          </label>

          <label>
            Account Role
            <input
              id="role"
              readonly
            >
          </label>

        </div>

      </section>

      <!-- PHONE NUMBERS -->
      <section class="panel">

        <div class="section-heading">

          <div>
            <h2>Phone Numbers</h2>
            <p class="profile-optional">
              Optional — you can add a phone number.
            </p>
          </div>

          <button
            type="button"
            id="add-phone"
            class="secondary"
            hidden
          >
            + Add Phone
          </button>

        </div>

        <div id="phones-list">
          <p>Loading phone numbers...</p>
        </div>

      </section>

      <!-- ADDRESSES -->
      <section class="panel">

        <div class="section-heading">

          <div>
            <h2>Addresses</h2>
            <p class="profile-optional">
              Optional — you can add an address.
            </p>
          </div>

          <button
            type="button"
            id="add-address"
            class="secondary"
            hidden
          >
            + Add Address
          </button>

        </div>

        <div id="addresses-list">
          <p>Loading addresses...</p>
        </div>

      </section>

      <!-- SAVE / CANCEL -->
      <div class="actions" id="profile-actions" hidden>

        <button
          type="submit"
          id="save-button"
          class="primary"
        >
          Save Changes
        </button>

        <button
          type="button"
          id="cancel-edit-btn"
          class="secondary"
        >
          Cancel
        </button>

      </div>

    </form>

  </main>

  <style>
    .profile-optional {
      margin: 5px 0 0;
      font-size: 13px;
      color: #64748b;
    }

    #profile-form input[readonly] {
      background: #f8fafc;
      color: #334155;
      cursor: default;
    }

    #profile-form input:not([readonly]) {
      background: white;
    }

    #profile-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 24px;
    }

    #profile-actions[hidden],
    #add-phone[hidden],
    #add-address[hidden] {
      display: none !important;
    }

    #message:not(:empty) {
      margin: 15px 0;
    }
  </style>

</body>
</html>

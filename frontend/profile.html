
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | FixTrack</title>

  <link rel="stylesheet" href="style.css?v=8">

  <style>
    .profile-page {
      max-width: 850px;
      margin: 30px auto 80px;
    }

    .profile-page h1 {
      margin-bottom: 5px;
      color: #0f172a;
    }

    .profile-page .intro {
      margin-bottom: 18px;
      color: #64748b;
    }

    .profile-edit-toolbar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 20px;
    }

    .profile-panel {
      background: white;
      border-radius: 13px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 5px 20px rgba(15, 23, 42, 0.04);
    }

    .profile-panel h2 {
      margin: 0 0 18px;
      font-size: 18px;
      color: #0f172a;
    }

    .profile-grid {
      display: grid;
      gap: 14px;
      margin-bottom: 20px;
    }

    .profile-grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .profile-grid.two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .profile-field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }

    .profile-field input {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 7px;
      font: inherit;
      font-size: 14px;
      color: #0f172a;
      background: white;
    }

    .profile-field input[readonly] {
      background: #f8fafc;
    }

    .profile-section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }

    .profile-section-heading h2 {
      margin-bottom: 5px;
    }

    .profile-optional {
      color: #64748b;
      font-size: 12px;
      margin: 0;
    }

    .profile-entry {
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .profile-entry h3 {
      font-size: 14px;
      margin: 0 0 14px;
    }

    .profile-empty {
      color: #64748b;
      font-size: 14px;
      margin: 0;
    }

    .profile-btn {
      border: 0;
      border-radius: 7px;
      padding: 11px 16px;
      background: #2563eb;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .profile-btn.secondary {
      background: #e8efff;
      color: #1d4ed8;
    }

    .profile-btn.remove {
      background: #fee2e2;
      color: #b91c1c;
      margin-top: 10px;
    }

    .profile-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .profile-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 24px;
    }

    .profile-primary-choice {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
      font-size: 13px;
    }

    #message:not(:empty) {
      padding: 12px 15px;
      border-radius: 8px;
      background: #eff6ff;
      color: #1d4ed8;
      margin-bottom: 18px;
      font-size: 14px;
    }

    #message.error {
      background: #fef2f2;
      color: #b91c1c;
    }

    #message.success {
      background: #f0fdf4;
      color: #15803d;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 650px) {
      .profile-grid.three,
      .profile-grid.two {
        grid-template-columns: 1fr;
      }

      .profile-panel {
        padding: 18px;
      }

      .profile-section-heading {
        align-items: flex-start;
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <div>
      <div class="brand">FixTrack</div>
      <div class="subtitle">
        Computer Repair Management System
      </div>
    </div>

    <a href="dashboard.html" class="back-button">
      Back to Dashboard
    </a>
  </header>

  <main class="container profile-page">

    <h1>My Profile</h1>

    <p class="intro">
      View and manage your personal information.
    </p>

    <div id="message" role="status" aria-live="polite"></div>

    <div class="profile-edit-toolbar">
      <button
        type="button"
        id="edit-profile-btn"
        class="profile-btn"
        disabled
      >
        Edit Profile
      </button>
    </div>

    <form id="profile-form">

      <section class="profile-panel">
        <h2>Personal Information</h2>

        <div class="profile-grid three">
          <label class="profile-field">
            First Name
            <input id="first_name" maxlength="100" required readonly>
          </label>

          <label class="profile-field">
            Middle Name
            <input id="middle_name" maxlength="100" readonly>
          </label>

          <label class="profile-field">
            Last Name
            <input id="last_name" maxlength="100" required readonly>
          </label>
        </div>

        <div class="profile-grid two">
          <label class="profile-field">
            Email Address
            <input id="email" type="email" maxlength="255" required readonly>
          </label>

          <label class="profile-field">
            Account Role
            <input id="role" readonly>
          </label>
        </div>
      </section>

      <section class="profile-panel">
        <div class="profile-section-heading">
          <div>
            <h2>Phone Numbers</h2>
            <p class="profile-optional">
              Optional — add a phone number if you want.
            </p>
          </div>

          <button
            type="button"
            id="add-phone"
            class="profile-btn secondary"
            hidden
          >
            + Add Phone
          </button>
        </div>

        <div id="phones-list">
          <p>Loading phone numbers...</p>
        </div>
      </section>

      <section class="profile-panel">
        <div class="profile-section-heading">
          <div>
            <h2>Addresses</h2>
            <p class="profile-optional">
              Optional — add an address if you want.
            </p>
          </div>

          <button
            type="button"
            id="add-address"
            class="profile-btn secondary"
            hidden
          >
            + Add Address
          </button>
        </div>

        <div id="addresses-list">
          <p>Loading addresses...</p>
        </div>
      </section>

      <div id="profile-actions" class="profile-actions" hidden>
        <button
          type="submit"
          id="save-button"
          class="profile-btn"
        >
          Save Changes
        </button>

        <button
          type="button"
          id="cancel-edit-btn"
          class="profile-btn secondary"
        >
          Cancel
        </button>
      </div>

    </form>
  </main>

  <script>
    const PROFILE_API =
      "https://fixtrack-backend.vercel.app/api/profile";

    const token = localStorage.getItem("fixtrack_token");

    const form = document.getElementById("profile-form");
    const messageBox = document.getElementById("message");
    const phonesList = document.getElementById("phones-list");
    const addressesList = document.getElementById("addresses-list");

    const editButton = document.getElementById("edit-profile-btn");
    const cancelButton = document.getElementById("cancel-edit-btn");
    const saveButton = document.getElementById("save-button");
    const actions = document.getElementById("profile-actions");
    const addPhoneButton = document.getElementById("add-phone");
    const addAddressButton = document.getElementById("add-address");

    let phones = [];
    let addresses = [];
    let editing = false;
    let profileLoaded = false;

    function field(id) {
      return document.getElementById(id);
    }

    function notify(text, type = "") {
      messageBox.textContent = text;
      messageBox.className = type;
    }

    function create(tag, className = "", text = "") {
      const node = document.createElement(tag);
      node.className = className;
      node.textContent = text;
      return node;
    }

    async function api(method, data) {
      const response = await fetch(PROFILE_API, {
        method,
        headers: {
          Authorization: `Bearer ${token}`,
          ...(data ? {
            "Content-Type": "application/json"
          } : {})
        },
        ...(data ? {
          body: JSON.stringify(data)
        } : {})
      });

      const result = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(
          result.error ||
          result.message ||
          `Request failed (${response.status})`
        );
      }

      return result;
    }

    function populateUser(user) {
      field("first_name").value = user.first_name || "";
      field("middle_name").value = user.middle_name || "";
      field("last_name").value = user.last_name || "";
      field("email").value = user.email || "";
      field("role").value = user.role || "customer";
    }

    function setEditMode(enabled) {
      editing = enabled;

      ["first_name", "middle_name", "last_name", "email"]
        .forEach(id => {
          field(id).readOnly = !enabled;
        });

      field("role").readOnly = true;

      actions.hidden = !enabled;
      addPhoneButton.hidden = !enabled;
      addAddressButton.hidden = !enabled;

      editButton.textContent =
        enabled ? "Cancel Editing" : "Edit Profile";

      drawPhones();
      drawAddresses();
    }

    function makeInput(labelText, value, onChange, maxLength) {
      const label = create("label", "profile-field");

      label.append(document.createTextNode(labelText));

      const input = document.createElement("input");
      input.type = "text";
      input.value = value || "";
      input.maxLength = maxLength;
      input.disabled = !editing;

      input.addEventListener("input", () => {
        onChange(input.value);
      });

      label.appendChild(input);

      return label;
    }

    function drawPhones() {
      phonesList.replaceChildren();

      if (!phones.length) {
        phonesList.appendChild(
          create(
            "p",
            "profile-empty",
            "No phone numbers added."
          )
        );
        return;
      }

      phones.forEach((phone, index) => {
        const card = create("div", "profile-entry");

        card.appendChild(
          create("h3", "", `Phone ${index + 1}`)
        );

        const grid = create("div", "profile-grid two");

        grid.appendChild(makeInput(
          "Phone Number",
          phone.phone_number,
          value => phone.phone_number = value,
          30
        ));

        grid.appendChild(makeInput(
          "Type (Mobile, Home, etc.)",
          phone.type,
          value => phone.type = value,
          50
        ));

        card.appendChild(grid);

        if (editing) {
          const remove = create(
            "button",
            "profile-btn remove",
            "Remove Phone"
          );

          remove.type = "button";

          remove.addEventListener("click", () => {
            phones.splice(index, 1);
            drawPhones();
          });

          card.appendChild(remove);
        }

        phonesList.appendChild(card);
      });
    }

    function drawAddresses() {
      addressesList.replaceChildren();

      if (!addresses.length) {
        addressesList.appendChild(
          create(
            "p",
            "profile-empty",
            "No addresses added."
          )
        );
        return;
      }

      addresses.forEach((address, index) => {
        const card = create("div", "profile-entry");

        card.appendChild(
          create("h3", "", `Address ${index + 1}`)
        );

        const firstGrid = create("div", "profile-grid two");

        firstGrid.appendChild(makeInput(
          "Street Address",
          address.street_address,
          value => address.street_address = value,
          255
        ));

        firstGrid.appendChild(makeInput(
          "City",
          address.city,
          value => address.city = value,
          100
        ));

        const secondGrid = create("div", "profile-grid two");

        secondGrid.appendChild(makeInput(
          "Province",
          address.province,
          value => address.province = value,
          100
        ));

        secondGrid.appendChild(makeInput(
          "Postal Code",
          address.postal_code,
          value => address.postal_code = value,
          20
        ));

        card.append(firstGrid, secondGrid);

        const primaryLabel = create(
          "label",
          "profile-primary-choice"
        );

        const radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "primary-address";
        radio.checked = Boolean(address.is_primary);
        radio.disabled = !editing;

        radio.addEventListener("change", () => {
          addresses.forEach((item, i) => {
            item.is_primary = i === index;
          });

          drawAddresses();
        });

        primaryLabel.append(
          radio,
          document.createTextNode("Primary Address")
        );

        card.appendChild(primaryLabel);

        if (editing) {
          const remove = create(
            "button",
            "profile-btn remove",
            "Remove Address"
          );

          remove.type = "button";

          remove.addEventListener("click", () => {
            const wasPrimary = address.is_primary;

            addresses.splice(index, 1);

            if (wasPrimary && addresses.length) {
              addresses.forEach((item, i) => {
                item.is_primary = i === 0;
              });
            }

            drawAddresses();
          });

          card.appendChild(remove);
        }

        addressesList.appendChild(card);
      });
    }

    async function loadProfile() {
      notify("Loading your profile...");

      try {
        const data = await api("GET");

        if (!data.user) {
          throw new Error("Customer information not found.");
        }

        populateUser(data.user);

        phones = Array.isArray(data.phones) ? data.phones : [];
        addresses = Array.isArray(data.addresses)
          ? data.addresses
          : [];

        profileLoaded = true;
        editButton.disabled = false;

        setEditMode(false);
        notify("");

        return true;

      } catch (error) {
        console.error("Profile loading failed:", error);

        phonesList.textContent = "Unable to load phone numbers.";
        addressesList.textContent = "Unable to load addresses.";

        notify(
          "Failed to load profile: " + error.message,
          "error"
        );

        return false;
      }
    }

    async function cancelEditing() {
      setEditMode(false);
      await loadProfile();
    }

    editButton.addEventListener("click", () => {
      if (!profileLoaded) return;

      if (editing) {
        cancelEditing();
      } else {
        setEditMode(true);
      }
    });

    cancelButton.addEventListener("click", cancelEditing);

    addPhoneButton.addEventListener("click", () => {
      if (!editing) return;

      if (phones.length >= 10) {
        notify("Maximum 10 phone numbers.", "error");
        return;
      }

      phones.push({
        phone_number: "",
        type: "Mobile"
      });

      drawPhones();
    });

    addAddressButton.addEventListener("click", () => {
      if (!editing) return;

      if (addresses.length >= 10) {
        notify("Maximum 10 addresses.", "error");
        return;
      }

      addresses.push({
        street_address: "",
        city: "",
        province: "",
        postal_code: "",
        is_primary: addresses.length === 0
      });

      drawAddresses();
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();

      if (!editing || !profileLoaded) return;

      const firstName = field("first_name").value.trim();
      const middleName = field("middle_name").value.trim();
      const lastName = field("last_name").value.trim();
      const email = field("email").value.trim();

      if (!firstName || !lastName || !email) {
        notify(
          "Please complete your name and email.",
          "error"
        );
        return;
      }

      const cleanPhones = phones.filter(phone =>
        String(phone.phone_number || "").trim() !== ""
      );

      const cleanAddresses = addresses.filter(address =>
        [
          address.street_address,
          address.city,
          address.province,
          address.postal_code
        ].some(value => String(value || "").trim() !== "")
      );

      saveButton.disabled = true;
      saveButton.textContent = "Saving...";

      try {
        await api("PUT", {
          first_name: firstName,
          middle_name: middleName,
          last_name: lastName,
          email,
          phones: cleanPhones,
          addresses: cleanAddresses
        });

        let user = {};

        try {
          user = JSON.parse(
            localStorage.getItem("fixtrack_user") || "{}"
          );
        } catch (_) {}

        user.first_name = firstName;
        user.middle_name = middleName;
        user.last_name = lastName;
        user.email = email;

        localStorage.setItem(
          "fixtrack_user",
          JSON.stringify(user)
        );

        const loaded = await loadProfile();

        if (loaded) {
          notify(
            "Profile updated successfully!",
            "success"
          );
        }

      } catch (error) {
        console.error("Profile save failed:", error);
        notify(error.message, "error");

      } finally {
        saveButton.disabled = false;
        saveButton.textContent = "Save Changes";
      }
    });

    function startProfile() {
      actions.hidden = true;
      addPhoneButton.hidden = true;
      addAddressButton.hidden = true;
      editButton.disabled = true;

      if (!token) {
        notify(
          "Please log in to view your profile.",
          "error"
        );

        form.hidden = true;
        editButton.hidden = true;
        return;
      }

      // Display the saved login information immediately.
      try {
        const user = JSON.parse(
          localStorage.getItem("fixtrack_user") || "{}"
        );

        populateUser(user);
      } catch (error) {
        console.warn("Unable to read saved login data.");
      }

      // Load the authoritative profile from the database.
      loadProfile();
    }

    startProfile();
  </script>

</body>
</html>

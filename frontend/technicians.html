
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FixTrack | Manage Technicians</title>

    <link rel="stylesheet" href="style.css?v=5">
</head>

<body>

    <!-- HEADER -->
    <header class="dashboard-header">

        <div>
            <h1>FixTrack</h1>
            <p>Administrator Panel</p>
        </div>

        <button
            type="button"
            onclick="window.location.href='admin-dashboard.html'"
        >
            Back to Dashboard
        </button>

    </header>

    <!-- MAIN CONTENT -->
    <main class="dashboard-container">

        <!-- PAGE HEADING -->
        <section class="dashboard-welcome">

            <h2>Manage Technicians</h2>

            <p>
                Create technician accounts, edit technician
                information, and manage your repair team.
            </p>

        </section>

        <!-- TECHNICIAN MANAGEMENT -->
        <section class="device-section">

            <!-- ADD TECHNICIAN -->
            <div class="device-form-card">

                <h3>Add Technician</h3>

                <form id="technician-form">

                    <label for="tech-first-name">
                        First Name
                    </label>

                    <input
                        type="text"
                        id="tech-first-name"
                        maxlength="100"
                        required
                    >

                    <label for="tech-middle-name">
                        Middle Name
                    </label>

                    <input
                        type="text"
                        id="tech-middle-name"
                        maxlength="100"
                    >

                    <label for="tech-last-name">
                        Last Name
                    </label>

                    <input
                        type="text"
                        id="tech-last-name"
                        maxlength="100"
                        required
                    >

                    <label for="tech-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="tech-email"
                        maxlength="255"
                        required
                    >

                    <label for="tech-password">
                        Temporary Password
                    </label>

                    <input
                        type="password"
                        id="tech-password"
                        minlength="8"
                        required
                    >

                    <button type="submit">
                        Add Technician
                    </button>

                    <p id="technician-message"></p>

                </form>

            </div>

            <!-- TECHNICIAN LIST -->
            <div class="device-list-card">

                <h3>Technicians</h3>

                <p
                    id="technician-action-message"
                    role="status"
                    aria-live="polite"
                ></p>

                <div id="technician-list">

                    <p>Loading technicians...</p>

                </div>

            </div>

        </section>

    </main>

    <!-- TECHNICIAN MANAGEMENT -->
    <script src="technicians.js?v=5"></script>

</body>
</html>
